<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mohamed Sakhi | Créateur de produits numériques</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f8f5;
    color: #1f2a19;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 15px;
}

.card {
    width: 100%;
    max-width: 430px;
    background: #ffffff;
    border-radius: 24px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 15px 45px rgba(0,0,0,0.08);
    border: 1px solid rgba(65,117,5,0.12);
}

.logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #417505;
    margin-bottom: 28px;
}

.avatar {
    width: 95px;
    height: 95px;
    border-radius: 50%;
    margin: 0 auto 20px;
    background: #417505;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    box-shadow: 0 8px 25px rgba(65,117,5,0.25);
}

h1 {
    font-size: 27px;
    margin-bottom: 10px;
    color: #1f2a19;
}

.subtitle {
    color: #417505;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 25px;
}

.description {
    color: #666;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 25px;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.btn {
    display: block;
    text-decoration: none;
    padding: 15px;
    border-radius: 13px;
    font-size: 15px;
    font-weight: 600;
    transition: 0.25s ease;
    border: 1px solid rgba(65,117,5,0.15);
    background: #ffffff;
    color: #417505;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 18px rgba(0,0,0,0.08);
}

.btn-main {
    background: #417505;
    color: #ffffff;
    border-color: #417505;
}

.footer {
    margin-top: 28px;
    font-size: 12px;
    color: #999;
}

@media (max-width: 380px) {
    .card {
        padding: 30px 20px;
    }

    h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">TOP MARKET</div>

    <div class="avatar">MS</div>

    <h1>Mohamed Sakhi</h1>

    <div class="subtitle">
        Créateur de produits numériques
    </div>

    <div class="description">
        Création de solutions numériques modernes et professionnelles.
        Découvrez mes projets et contactez-moi directement.
    </div>

    <div class="buttons">

        <a class="btn btn-main"
           href="https://wa.me/212728018946"
           target="_blank">
            💬 WhatsApp
        </a>

        <a class="btn"
           href="https://www.instagram.com/topmarket741?stkn=OWs3eWdiY3ppbGJu"
           target="_blank">
            Instagram
        </a>

        <a class="btn"
           href="https://www.facebook.com/share/1CMhfdQ5oV/"
           target="_blank">
            Facebook
        </a>

        <a class="btn"
           href="https://www.topmarket.pro/"
           target="_blank">
            🌐 Visiter Top Market
        </a>

    </div>

    <div class="footer">
        © 2026 Mohamed Sakhi
    </div>

</div>

</body>
