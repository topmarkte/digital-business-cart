<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mohamed Sakhi | Créateur de produits numériques</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --green: #417505;
    --dark: #17200f;
    --soft: #f6f7f3;
    --gold: #b59b5b;
}

body {
    min-height: 100vh;
    padding: 22px 14px;
    display: flex;
    align-items: center;
    justify-content: center;

    font-family: Arial, Helvetica, sans-serif;
    color: var(--dark);

    background:
        radial-gradient(circle at 10% 10%, rgba(65,117,5,.08), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(181,155,91,.08), transparent 30%),
        #f7f8f5;
}

/* ===== CARD ===== */

.card {
    position: relative;
    width: 100%;
    max-width: 440px;

    padding: 38px 27px 30px;

    background: rgba(255,255,255,.96);

    border: 1px solid rgba(65,117,5,.16);
    border-radius: 28px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.10),
        0 5px 18px rgba(65,117,5,.06);

    text-align: center;

    overflow: hidden;

    animation: cardIn .9s cubic-bezier(.2,.8,.2,1);
}

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(
        90deg,
        transparent,
        var(--green),
        var(--gold),
        var(--green),
        transparent
    );
}

/* ===== LOGO ===== */

.logo {
    color: var(--green);
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 4px;

    margin-bottom: 30px;

    animation: fadeDown .8s ease .1s both;
}

/* ===== INITIALS ===== */

.avatar {
    width: 105px;
    height: 105px;

    margin: 0 auto 21px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: white;
    background:
        linear-gradient(145deg, #527f19, #315900);

    font-size: 34px;
    font-weight: 700;
    letter-spacing: 2px;

    border: 4px solid white;

    box-shadow:
        0 0 0 1px rgba(65,117,5,.22),
        0 12px 35px rgba(65,117,5,.22);

    animation: avatarIn 1s cubic-bezier(.2,.8,.2,1) .15s both;
}

/* ===== NAME ===== */

h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: .2px;

    margin-bottom: 9px;

    animation: fadeUp .7s ease .25s both;
}

.subtitle {
    color: var(--green);

    font-size: 15px;
    font-weight: 700;

    letter-spacing: .2px;

    margin-bottom: 21px;

    animation: fadeUp .7s ease .35s both;
}

/* ===== DESCRIPTION ===== */

.description {
    max-width: 350px;
    margin: 0 auto 27px;

    color: #777;

    font-size: 14px;
    line-height: 1.75;

    animation: fadeUp .7s ease .45s both;
}

/* ===== BUTTONS ===== */

.buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.btn {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 51px;

    padding: 14px 18px;

    border-radius: 15px;

    text-decoration: none;

    font-size: 14px;
    font-weight: 700;

    color: var(--green);

    background: #fff;

    border: 1px solid rgba(65,117,5,.15);

    box-shadow: 0 5px 15px rgba(0,0,0,.035);

    overflow: hidden;

    transition:
        transform .28s ease,
        box-shadow .28s ease,
        background .28s ease;

    opacity: 0;
    animation: buttonIn .65s ease forwards;
}

.btn:nth-child(1) { animation-delay: .50s; }
.btn:nth-child(2) { animation-delay: .58s; }
.btn:nth-child(3) { animation-delay: .66s; }
.btn:nth-child(4) { animation-delay: .74s; }
.btn:nth-child(5) { animation-delay: .82s; }
.btn:nth-child(6) { animation-delay: .90s; }

.btn::before {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 100%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.55),
        transparent
    );

    transition: left .55s ease;
}

.btn:hover::before {
    left: 100%;
}

.btn:hover {
    transform: translateY(-3px);

    box-shadow:
        0 12px 25px rgba(0,0,0,.08),
        0 4px 12px rgba(65,117,5,.06);
}

.btn:active {
    transform: scale(.97);
}

/* ===== MAIN WHATSAPP BUTTON ===== */

.btn-main {
    color: white;
    background: linear-gradient(135deg, #417505, #315900);

    border-color: #417505;

    box-shadow:
        0 10px 25px rgba(65,117,5,.20);
}

/* ===== CONTACT BUTTON ===== */

.contact-btn {
    background: #f8f9f6;
}

/* ===== SHARE BUTTON ===== */

.share-btn {
    color: #17200f;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f1f4ec
        );

    border-color: rgba(181,155,91,.28);
}

/* ===== FOOTER ===== */

.footer {
    margin-top: 28px;

    color: #aaa;

    font-size: 11px;
    letter-spacing: .3px;

    animation: fadeUp .7s ease 1s both;
}

/* ===== ANIMATIONS ===== */

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(35px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes avatarIn {
    from {
        opacity: 0;
        transform: scale(.65) rotate(-8deg);
    }

    to {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}

@keyframes fadeDown {
    from {
        opacity: 0;
        transform: translateY(-15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes buttonIn {
    from {
        opacity: 0;
        transform: translateX(25px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@media (max-width: 380px) {

    .card {
        padding: 32px 20px 26px;
        border-radius: 24px;
    }

    .avatar {
        width: 92px;
        height: 92px;
        font-size: 30px;
    }

    h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">
        TOP MARKET
    </div>

    <div class="avatar">
        MH
    </div>

    <h1>
        Mohamed Sakhi
    </h1>

    <div class="subtitle">
        Créateur de produits numériques
    </div>

    <div class="description">
        Création de solutions numériques modernes et professionnelles.
        Découvrez mes projets et contactez-moi directement.
    </div>

    <div class="buttons">

        <a class="btn btn-main"
           href="https://wa.me/212728018946"
           target="_blank">
            💬 WhatsApp
        </a>

        <a class="btn"
           href="https://www.instagram.com/topmarket741?stkn=OWs3eWdiY3ppbGJu"
           target="_blank">
            Instagram
        </a>

        <a class="btn"
           href="https://www.facebook.com/share/1CMhfdQ5oV/"
           target="_blank">
            Facebook
        </a>

        <a class="btn"
           href="https://www.topmarket.pro/"
           target="_blank">
            🌐 Visiter Top Market
        </a>

        <a class="btn contact-btn"
           href="#"
           onclick="downloadContact(); return false;">
            📇 Enregistrer le contact
        </a>

        <a class="btn share-btn"
           href="#"
           onclick="shareCard(); return false;">
            ↗ Partager ma carte
        </a>

    </div>

    <div class="footer">
        © 2026 Mohamed Sakhi
    </div>

</div>

<script>

/* ===== SAVE CONTACT ===== */

function downloadContact() {

    const vCard =
`BEGIN:VCARD
VERSION:3.0
FN:Mohamed Sakhi
N:Sakhi;Mohamed;;;
TITLE:Créateur de produits numériques
TEL;TYPE=CELL:+212728018946
URL;TYPE=Instagram:https://www.instagram.com/topmarket741?stkn=OWs3eWdiY3ppbGJu
URL;TYPE=Facebook:https://www.facebook.com/share/1CMhfdQ5oV/
URL;TYPE=Website:https://www.topmarket.pro/
END:VCARD`;

    const blob = new Blob(
        [vCard],
        { type: "text/vcard;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "Mohamed-Sakhi.vcf";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);
}


/* ===== SHARE CARD ===== */

async function shareCard() {

    const shareData = {
        title: "Mohamed Sakhi",
        text: "Découvrez ma carte de visite digitale.",
        url: window.location.href
    };

    try {

        if (navigator.share) {

            await navigator.share(shareData);

        } else {

            await navigator.clipboard.writeText(
                window.location.href
            );

            alert("Lien de la carte copié !");
        }

    } catch (error) {

        if (error.name !== "AbortError") {

            alert("Impossible de partager la carte.");

        }
    }
}

</script>

</body>
</html>
