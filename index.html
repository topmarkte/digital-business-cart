<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mohamed Sakhi | Créateur de produits numériques</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f8f5;
    color: #1f2a19;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 15px;
}

.card {
    width: 100%;
    max-width: 430px;
    background: #ffffff;
    border-radius: 24px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 15px 45px rgba(0,0,0,0.08);
    border: 1px solid rgba(65,117,5,0.12);

    animation: cardEnter 0.8s ease forwards;
}

@keyframes cardEnter {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #417505;
    margin-bottom: 28px;
}

.avatar {
    width: 95px;
    height: 95px;
    border-radius: 50%;
    margin: 0 auto 20px;
    background: #417505;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    box-shadow: 0 8px 25px rgba(65,117,5,0.25);

    animation: avatarEnter 1s ease forwards;
}

@keyframes avatarEnter {
    from {
        opacity: 0;
        transform: scale(0.7);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

h1 {
    font-size: 27px;
    margin-bottom: 10px;
    color: #1f2a19;
}

.subtitle {
    color: #417505;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 25px;
}

.description {
    color: #666;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 25px;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.btn {
    display: block;
    text-decoration: none;
    padding: 15px;
    border-radius: 13px;
    font-size: 15px;
    font-weight: 600;
    transition: all 0.3s ease;

    border: 1px solid rgba(65,117,5,0.15);
    background: #ffffff;
    color: #417505;

    opacity: 0;
    animation: buttonEnter 0.6s ease forwards;
}

.btn:nth-child(1) {
    animation-delay: 0.2s;
}

.btn:nth-child(2) {
    animation-delay: 0.3s;
}

.btn:nth-child(3) {
    animation-delay: 0.4s;
}

.btn:nth-child(4) {
    animation-delay: 0.5s;
}

.btn:nth-child(5) {
    animation-delay: 0.6s;
}

@keyframes buttonEnter {
    from {
        opacity: 0;
        transform: translateX(25px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.09);
}

.btn:active {
    transform: scale(0.97);
}

.btn-main {
    background: #417505;
    color: #ffffff;
    border-color: #417505;
}

.contact-btn {
    background: #f7f8f5;
}

.footer {
    margin-top: 28px;
    font-size: 12px;
    color: #999;
}

@media (max-width: 380px) {

    .card {
        padding: 30px 20px;
    }

    h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">TOP MARKET</div>

    <div class="avatar">MH</div>

    <h1>Mohamed Sakhi</h1>

    <div class="subtitle">
        Créateur de produits numériques
    </div>

    <div class="description">
        Création de solutions numériques modernes et professionnelles.
        Découvrez mes projets et contactez-moi directement.
    </div>

    <div class="buttons">

        <a class="btn btn-main"
           href="https://wa.me/212728018946"
           target="_blank">
            💬 WhatsApp
        </a>

        <a class="btn"
           href="https://www.instagram.com/topmarket741?stkn=OWs3eWdiY3ppbGJu"
           target="_blank">
            Instagram
        </a>

        <a class="btn"
           href="https://www.facebook.com/share/1CMhfdQ5oV/"
           target="_blank">
            Facebook
        </a>

        <a class="btn"
           href="https://www.topmarket.pro/"
           target="_blank">
            🌐 Visiter Top Market
        </a>

        <a class="btn contact-btn"
           href="#"
           onclick="downloadContact(); return false;">
            📇 Enregistrer le contact
        </a>

    </div>

    <div class="footer">
        © 2026 Mohamed Sakhi
    </div>

</div>

<script>

function downloadContact() {

    const vCard =
`BEGIN:VCARD
VERSION:3.0
FN:Mohamed Sakhi
N:Sakhi;Mohamed;;;
TITLE:Créateur de produits numériques
TEL;TYPE=CELL:+212728018946
URL;TYPE=Instagram:https://www.instagram.com/topmarket741?stkn=OWs3eWdiY3ppbGJu
URL;TYPE=Facebook:https://www.facebook.com/share/1CMhfdQ5oV/
URL;TYPE=Website:https://www.topmarket.pro/
END:VCARD`;

    const blob = new Blob(
        [vCard],
        { type: "text/vcard;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "Mohamed-Sakhi.vcf";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);
}

</script>

</body>
</html>
