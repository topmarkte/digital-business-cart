<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --green: #417505;
    --green-dark: #315900;
    --dark: #17200f;
    --gray: #777;
    --light: #f6f7f3;
    --gold: #b59b5b;
    --white: #ffffff;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    padding: 22px 14px 45px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: var(--dark);

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(65,117,5,.08),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(181,155,91,.09),
            transparent 30%
        ),

        #f7f8f5;
}


/* =========================
   MAIN CARD
========================= */

.card {

    position: relative;

    width: 100%;
    max-width: 470px;

    margin: auto;

    padding: 34px 25px 30px;

    background:
        rgba(255,255,255,.97);

    border:
        1px solid
        rgba(65,117,5,.16);

    border-radius: 30px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.10),
        0 5px 18px rgba(65,117,5,.06);

    overflow: hidden;

    animation:
        cardIn .9s
        cubic-bezier(.2,.8,.2,1);
}

.card::before {

    content: "";

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 3px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--green),
            var(--gold),
            var(--green),
            transparent
        );
}


/* =========================
   LANGUAGE
========================= */

.language-switcher {

    display: flex;
    justify-content: center;
    gap: 7px;
    margin-bottom: 22px;
}

.lang-btn {

    border:
        1px solid
        rgba(65,117,5,.15);

    background: #fff;
    color: #777;

    padding: 6px 11px;

    border-radius: 20px;

    font-size: 11px;
    font-weight: 700;

    cursor: pointer;

    transition: .25s ease;
}

.lang-btn.active,
.lang-btn:hover {

    background: var(--green);
    color: white;
    border-color: var(--green);
}


/* =========================
   LOGO
========================= */

.logo {

    color: var(--green);

    font-size: 24px;
    font-weight: 800;

    letter-spacing: 4px;

    text-align: center;

    margin-bottom: 28px;

    animation:
        fadeDown .8s
        ease .1s both;
}


/* =========================
   AVATAR
========================= */

.avatar {

    width: 105px;
    height: 105px;

    margin:
        0 auto 20px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: white;

    background:
        linear-gradient(
            145deg,
            #527f19,
            #315900
        );

    font-size: 34px;
    font-weight: 700;

    letter-spacing: 2px;

    border:
        4px solid white;

    box-shadow:

        0 0 0 1px
        rgba(65,117,5,.22),

        0 12px 35px
        rgba(65,117,5,.22);

    animation:
        avatarIn 1s
        cubic-bezier(.2,.8,.2,1)
        .15s both;
}


/* =========================
   INTRO
========================= */

h1 {

    font-size: 28px;
    font-weight: 700;

    text-align: center;

    margin-bottom: 9px;
}

.subtitle {

    color: var(--green);

    font-size: 15px;
    font-weight: 700;

    text-align: center;

    margin-bottom: 18px;
}

.description {

    max-width: 365px;

    margin:
        0 auto 26px;

    color: #777;

    font-size: 14px;
    line-height: 1.75;

    text-align: center;
}


/* =========================
   BUTTONS
========================= */

.buttons {

    display: flex;

    flex-direction: column;

    gap: 11px;
}

.btn {

    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 10px;

    min-height: 51px;

    padding: 13px 18px;

    border-radius: 15px;

    text-decoration: none;

    font-size: 14px;
    font-weight: 700;

    color: var(--green);

    background: #fff;

    border:
        1px solid
        rgba(65,117,5,.15);

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.035);

    transition:
        transform .28s ease,
        box-shadow .28s ease,
        background .28s ease;
}

.btn:hover {

    transform:
        translateY(-3px);

    box-shadow:

        0 12px 25px
        rgba(0,0,0,.08),

        0 4px 12px
        rgba(65,117,5,.06);
}

.btn:active {

    transform:
        scale(.97);
}

.btn svg {

    width: 19px;
    height: 19px;

    flex-shrink: 0;
}


/* WhatsApp */

.btn-main {

    color: white;

    background:
        linear-gradient(
            135deg,
            #417505,
            #315900
        );

    border-color:
        #417505;

    box-shadow:

        0 10px 25px
        rgba(65,117,5,.20);
}


/* Email */

.email-btn {

    background:
        #fafbf8;
}


/* Contact */

.contact-btn {

    background:
        #f8f9f6;
}


/* Share */

.share-btn {

    color: #17200f;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f1f4ec
        );

    border-color:
        rgba(181,155,91,.30);
}


/* =========================
   SECTIONS
========================= */

.section {

    margin-top: 30px;

    padding-top: 25px;

    border-top:
        1px solid
        rgba(65,117,5,.10);
}

.section-title {

    text-align: center;

    font-size: 19px;
    font-weight: 800;

    margin-bottom: 17px;
}

.section-title span {

    color:
        var(--green);
}


/* =========================
   ABOUT
========================= */

.about-box {

    background:
        var(--light);

    padding: 18px;

    border-radius: 17px;

    border:
        1px solid
        rgba(65,117,5,.08);

    color: #666;

    font-size: 13px;
    line-height: 1.8;

    text-align: center;
}


/* =========================
   SERVICES
========================= */

.services {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 11px;
}

.service {

    padding: 17px 10px;

    background: #fff;

    border:
        1px solid
        rgba(65,117,5,.12);

    border-radius: 16px;

    text-align: center;

    transition: .25s ease;
}

.service:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 10px 22px
        rgba(0,0,0,.06);
}

.service-icon {

    width: 38px;
    height: 38px;

    margin:
        0 auto 9px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 12px;

    color:
        var(--green);

    background:
        rgba(65,117,5,.08);
}

.service-icon svg {

    width: 20px;
    height: 20px;
}

.service h3 {

    font-size: 13px;

    margin-bottom: 5px;
}

.service p {

    color: #888;

    font-size: 11px;

    line-height: 1.5;
}


/* =========================
   PORTFOLIO
========================= */

.project {

    padding: 17px;

    margin-bottom: 11px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f5f7f1
        );

    border:
        1px solid
        rgba(65,117,5,.12);

    border-radius: 17px;

    transition: .25s ease;
}

.project:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 10px 22px
        rgba(0,0,0,.06);
}

.project-top {

    display: flex;

    align-items: center;

    gap: 12px;
}

.project-icon {

    width: 42px;
    height: 42px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    background:
        linear-gradient(
            145deg,
            #527f19,
            #315900
        );

    border-radius: 13px;
}

.project-icon svg {

    width: 21px;
    height: 21px;
}

.project h3 {

    font-size: 14px;

    margin-bottom: 4px;
}

.project p {

    color: #888;

    font-size: 11px;

    line-height: 1.5;
}


/* =========================
   STATS
========================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 8px;
}

.stat {

    text-align: center;

    padding: 15px 5px;

    background:
        #fafbf8;

    border-radius: 15px;

    border:
        1px solid
        rgba(65,117,5,.08);
}

.stat strong {

    display: block;

    color:
        var(--green);

    font-size: 21px;

    margin-bottom: 4px;
}

.stat span {

    color: #888;

    font-size: 10px;
}


/* =========================
   QR CODE
========================= */

.qr-box {

    text-align: center;
}

.qr-box img {

    width: 150px;
    height: 150px;

    padding: 8px;

    background: white;

    border-radius: 18px;

    border:
        1px solid
        rgba(65,117,5,.15);

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.07);
}

.qr-text {

    margin-top: 11px;

    color: #888;

    font-size: 11px;
}


/* =========================
   FOOTER
========================= */

.footer {

    margin-top: 30px;

    padding-top: 20px;

    border-top:
        1px solid
        rgba(65,117,5,.09);

    color: #aaa;

    font-size: 11px;

    text-align: center;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes cardIn {

    from {

        opacity: 0;

        transform:
            translateY(35px)
            scale(.97);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}

@keyframes avatarIn {

    from {

        opacity: 0;

        transform:
            scale(.65)
            rotate(-8deg);
    }

    to {

        opacity: 1;

        transform:
            scale(1)
            rotate(0);
    }
}

@keyframes fadeDown {

    from {

        opacity: 0;

        transform:
            translateY(-15px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 380px) {

    body {

        padding:
            12px 9px 30px;
    }

    .card {

        padding:
            28px 18px 25px;

        border-radius:
            24px;
    }

    .avatar {

        width: 92px;
        height: 92px;

        font-size: 30px;
    }

    h1 {

        font-size: 24px;
    }

    .services {

        gap: 8px;
    }
}

</style>
